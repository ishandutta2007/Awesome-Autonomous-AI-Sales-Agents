<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="pulseOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.7; }
        50% { transform: translateY(-12px) scale(1.05); opacity: 0.95; }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
        50% { transform: translateY(14px) scale(0.98); opacity: 0.9; }
      }
      @keyframes pulsePulse {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.3); opacity: 0.6; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dataTrack {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateX(280px); opacity: 0; }
      }

      .floating-pill-1 { animation: float1 5s ease-in-out infinite; }
      .floating-pill-2 { animation: float2 6s ease-in-out infinite; }
      .floating-pill-3 { animation: float1 7s ease-in-out infinite 1s; }
      .flow-path { stroke-dasharray: 6, 6; animation: dashFlow 20s linear infinite; }
      .pulse-bg { transform-origin: center; animation: pulsePulse 8s ease-in-out infinite; }
      .data-dot { animation: dataTrack 4s ease-in-out infinite; }
      .data-dot-delay { animation: dataTrack 4s ease-in-out infinite 2s; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #38bdf8;
      }
      .metric-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #64748b;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern (Subtle background) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Light Orbs in Background -->
  <circle cx="200" cy="100" r="180" fill="url(#pulseOrb)" class="pulse-bg" />
  <circle cx="1020" cy="320" r="220" fill="url(#pulseOrb)" class="pulse-bg" />

  <!-- DYNAMIC LAYER 1: Animated Flow Lines (Positioned safely on sides / bottom) -->
  <g opacity="0.4">
    <path class="flow-path" d="M 80,360 Q 250,300 450,370 T 900,340 T 1150,370" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
    <path class="flow-path" d="M 50,380 Q 300,340 600,390 T 1120,360" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,8" />
  </g>

  <!-- DYNAMIC LAYER 2: Floating Workflow Cards / Badges (Offset from center text) -->
  <!-- Floating Pill Left-Top -->
  <g class="floating-pill-1" transform="translate(60, 48)">
    <rect width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowFilter)" />
    <circle cx="24" cy="21" r="9" fill="#10b981" />
    <text x="44" y="26" class="tag-text">🤖 Autonomous SDR</text>
  </g>

  <!-- Floating Pill Right-Top -->
  <g class="floating-pill-2" transform="translate(950, 48)">
    <rect width="190" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.5" filter="url(#glowFilter)" />
    <circle cx="24" cy="21" r="9" fill="#6366f1" />
    <text x="44" y="26" class="tag-text">⚡ 24/7 Meeting Booking</text>
  </g>

  <!-- Floating Card Bottom-Left -->
  <g class="floating-pill-3" transform="translate(60, 310)">
    <rect width="210" height="64" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="28" class="metric-title">🎯 Inbound Qualification</text>
    <text x="20" y="48" class="metric-sub">&lt; 60s Lead Response Time</text>
  </g>

  <!-- Floating Card Bottom-Right -->
  <g class="floating-pill-1" transform="translate(930, 310)">
    <rect width="210" height="64" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="28" class="metric-title">📈 1:1 Hyper-Personalization</text>
    <text x="20" y="48" class="metric-sub">Self-Hosted &amp; Enterprise</text>
  </g>

  <!-- Animated Pipeline Line (Between Bottom Cards) -->
  <g transform="translate(320, 342)" opacity="0.6">
    <line x1="0" y1="0" x2="560" y2="0" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
    <circle class="data-dot" cx="0" cy="0" r="4" fill="#38bdf8" />
    <circle class="data-dot-delay" cx="0" cy="0" r="4" fill="#c084fc" />
  </g>

  <!-- FOREGROUND LAYER: Main Brand & Headings (Fixed & Crystal Clear) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Super-Badge / Pill -->
    <rect x="-140" y="-38" width="280" height="28" rx="14" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="-20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">
      ⚡ THE DEFINITIVE CURATED DIRECTORY
    </text>

    <!-- Title -->
    <text x="0" y="32" class="title-text">
      Awesome Autonomous AI Sales Agents
    </text>

    <!-- Accent bar below title -->
    <rect x="-110" y="52" width="220" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="94" class="subtitle-text">
      Enterprise AI SDRs, Open-Source Sales Reps, Voice Agents &amp; Outbound Automation
    </text>

    <!-- Highlights Row -->
    <g transform="translate(0, 134)">
      <text x="-210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="600" fill="#cbd5e1">
        💼 Commercial Platforms
      </text>
      <circle cx="-100" cy="-4" r="3" fill="#64748b" />
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="600" fill="#cbd5e1">
        🔓 Open-Source Frameworks
      </text>
      <circle cx="105" cy="-4" r="3" fill="#64748b" />
      <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="600" fill="#cbd5e1">
        📊 Pricing &amp; Benchmarks
      </text>
    </g>
  </g>
</svg>
